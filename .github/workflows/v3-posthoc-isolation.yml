name: V3 post-hoc isolated-browser verification
on:
  push:
    branches:
      - bench/v3-posthoc-browser-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: control-v3-001
            sha: 78e6715ea5a8518f6eb1d729e678259e0462c055
          - candidate: dds-v3-001
            sha: b0765100d776099234c437db2fe00a6a6aa480a4
          - candidate: p2p-original-v3-001
            sha: 2f3d0b0e952d4b67a2c51a787cec5109bbb215fe
          - candidate: p2p-improved-v3-001
            sha: 561d26e8f9373978963ec70df7e913b263f577a2
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable candidate SHA and original browser suite
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = '${{ matrix.sha }}'
          echo '86ce69cb2fde727512a1f26ff552213c250dd1a7ea2cc4e96edcbbbb97d5171d  tests/browser_board.py' | sha256sum -c -
      - name: Install Chromium E2E dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run API tests unchanged
        working-directory: candidate
        run: npm test
      - name: Run isolated original 7 and independent failed-un-save check
        shell: bash
        run: |
          set -uo pipefail
          cp audit/audit/browser_board_isolated.py candidate/tests/browser_board_isolated.py
          cd candidate
          python -m unittest discover -s tests -p browser_board_isolated.py -v 2>&1 | tee ../posthoc-result.log
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.candidate }}
          path: posthoc-result.log
          if-no-files-found: warn
