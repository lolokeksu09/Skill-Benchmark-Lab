name: Golden fixture checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Corrected web fixture must pass
        run: FIXTURE_VARIANT=reference node --test benchmarks/fixtures/web/tests/feed.test.mjs
      - name: Seeded web fixture must fail with expected assertions
        shell: bash
        run: |
          set +e
          FIXTURE_VARIANT=baseline node --test benchmarks/fixtures/web/tests/feed.test.mjs > web-baseline.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then echo "Seeded web fixture unexpectedly passed"; exit 1; fi
          grep -q "not ok" web-baseline.log || { cat web-baseline.log; exit 1; }
          echo "Expected web fixture failure confirmed"
      - name: Qwen3 control trial 001 must have exactly 1 pass and 2 known failures
        shell: bash
        run: |
          set +e
          FIXTURE_VARIANT=candidate-qwen3-control-001 node --test benchmarks/fixtures/web/tests/feed.test.mjs > qwen-control-001.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then cat qwen-control-001.log; echo "Unexpectedly all tests passed"; exit 1; fi
          grep -Fq '# tests 3' qwen-control-001.log || { cat qwen-control-001.log; exit 1; }
          grep -Fq '# pass 1' qwen-control-001.log || { cat qwen-control-001.log; exit 1; }
          grep -Fq '# fail 2' qwen-control-001.log || { cat qwen-control-001.log; exit 1; }
          grep -Fq 'not ok 1 - escapes user-controlled title markup' qwen-control-001.log || { cat qwen-control-001.log; exit 1; }
          grep -Fq 'not ok 2 - icon-only save button has an accessible name' qwen-control-001.log || { cat qwen-control-001.log; exit 1; }
          grep -Fq 'ok 3 - feed width is responsive rather than fixed to desktop pixels' qwen-control-001.log || { cat qwen-control-001.log; exit 1; }
          echo "Verified real Qwen control candidate: 1 pass, 2 known failures"
  android-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Corrected Kotlin fixture must pass
        run: gradle -p benchmarks/fixtures/android run --no-daemon -PfixtureVariant=reference
      - name: Seeded Kotlin fixture must fail with the expected marker
        shell: bash
        run: |
          set +e
          gradle -p benchmarks/fixtures/android run --no-daemon -PfixtureVariant=baseline > kotlin-baseline.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then echo "Seeded Kotlin fixture unexpectedly passed"; exit 1; fi
          grep -q "EXPECTED_FIXTURE_FAILURE" kotlin-baseline.log || { cat kotlin-baseline.log; exit 1; }
          echo "Expected Kotlin fixture failure confirmed"
