name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test evaluator
        run: python -m unittest discover -s tests -v
      - name: Validate scenarios
        run: python -m evaluator.benchmark --scenarios benchmarks/scenarios.json
