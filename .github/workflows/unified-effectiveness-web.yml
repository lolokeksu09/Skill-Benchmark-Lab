name: Unified Effectiveness Web scorer preflight
on:
  pull_request:
    paths:
      - 'benchmarks/unified-effectiveness-v1/**'
      - '.github/workflows/unified-effectiveness-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grader-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r benchmarks/unified-effectiveness-v1/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify known broken control is rejected
        run: python benchmarks/unified-effectiveness-v1/selftest.py
