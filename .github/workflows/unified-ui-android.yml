name: Unified UI Lab Android instrumentation
on:
  pull_request:
    paths:
      - 'benchmarks/unified-ui-ab-pilot/android/**'
      - '.github/workflows/unified-ui-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM access
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Android emulator and instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd benchmarks/unified-ui-ab-pilot/android
            gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-reports
          if-no-files-found: ignore
          path: |
            benchmarks/unified-ui-ab-pilot/android/app/build/outputs/androidTest-results/connected
            benchmarks/unified-ui-ab-pilot/android/app/build/reports/androidTests/connected
